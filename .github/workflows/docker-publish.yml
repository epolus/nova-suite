name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # All five components share one Docker Hub repository and are told apart by
      # a tag prefix, e.g. nova-suite:engine-0.1.0 and nova-suite:web-0.1.0.
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}/nova-suite
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: engine
            dockerfile: packages/nova-engine/Dockerfile
          - component: worker
            dockerfile: packages/nova-worker/Dockerfile
          - component: web
            dockerfile: packages/nova-web/Dockerfile
          - component: proxy
            dockerfile: infra/caddy/Dockerfile
          - component: postgres
            dockerfile: infra/postgres/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest=false is required: semver's automatic "latest" would be
          # unprefixed, so all five components would overwrite each other.
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.component }}-latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1,prefix=${{ matrix.component }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.component }}-
            type=semver,pattern={{major}},prefix=${{ matrix.component }}-
            type=sha,format=short,prefix=${{ matrix.component }}-sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the Docker Hub tag list free of "unknown/unknown" attestation entries
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
