# Excludes the intentional public-HTTP fetch sink from analysis.
# Callers must pass hrefs from toPublicHttpHref() after assertPublicHttpUrl()
# (public http(s) only, no credentials, private/loopback/link-local/metadata
# hosts blocked via hostname and DNS, redirects disabled). CodeQL does not
# treat that denylist as an SSRF sanitizer.
name: Nova Suite CodeQL
paths-ignore:
  - packages/nova-shared/src/node/public-http-fetch.ts
