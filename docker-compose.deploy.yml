# ─── Nova Suite – deployment stack (pulls published images, no build, no clone) ───
#
#   curl -O https://raw.githubusercontent.com/epolus/nova-suite/main/docker-compose.deploy.yml
#   curl -O https://raw.githubusercontent.com/epolus/nova-suite/main/.env.deploy.example
#   mv .env.deploy.example .env && edit the three required secrets
#   docker compose -f docker-compose.deploy.yml up -d
#
# Every component comes from one Docker Hub repository, distinguished by a tag
# prefix. Pin NOVA_TAG to a release (e.g. 0.1.0) for anything but a trial.
# Deliberately free of bind mounts so no repository files are needed at runtime.

services:
  # ─── PostgreSQL 18 (schema, RLS policies and runtime role baked in) ───
  postgres:
    image: ${NOVA_IMAGE:-epolus/nova-suite}:postgres-${NOVA_TAG:-latest}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_USER: ${POSTGRES_USER:-nova_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-nova_runtime}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      # Loads ~500 incidents / ~200 requests / ~80 CIs of sample data, first boot only
      NOVA_LOAD_DEMO_DATA: ${NOVA_LOAD_DEMO_DATA:-false}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_app} -d ${POSTGRES_DB:-nova}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── JWT signing keys (one-shot; generates a pair on first boot only) ───
  nova-keygen:
    image: ${NOVA_IMAGE:-epolus/nova-suite}:engine-${NOVA_TAG:-latest}
    restart: "no"
    command: ["node", "packages/nova-engine/dist/ensure-jwt-keys.js"]
    healthcheck:
      disable: true
    environment:
      JWT_PRIVATE_KEY_PATH: /secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /secrets/jwt-public.pem
    volumes:
      - nova_secrets:/secrets

  # ─── Schema migrator (one-shot; bootstrap role, not nova_runtime) ───
  nova-migrate:
    image: ${NOVA_IMAGE:-epolus/nova-suite}:engine-${NOVA_TAG:-latest}
    restart: "no"
    command: ["node", "packages/nova-engine/dist/migrate.js"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_USER: ${POSTGRES_USER:-nova_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # ─── Nova Engine API ───
  nova-engine:
    image: ${NOVA_IMAGE:-epolus/nova-suite}:engine-${NOVA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nova-migrate:
        condition: service_completed_successfully
      nova-keygen:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-nova_runtime}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      DB_SCHEMA_VERSION: ${DB_SCHEMA_VERSION:-v00.01.00}
      JWT_PRIVATE_KEY_PATH: /secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /secrets/jwt-public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-true}
      API_PORT: 4000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-nova-itsm}
      TEMPORAL_RETENTION_DAYS: ${TEMPORAL_RETENTION_DAYS:-30}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?CREDENTIALS_MASTER_KEY is required}
      CATALOG_AUTOMATION_SHARED_KEY: ${CATALOG_AUTOMATION_SHARED_KEY:?CATALOG_AUTOMATION_SHARED_KEY is required}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_DEFAULT_TTL_SECONDS: ${REDIS_DEFAULT_TTL_SECONDS:-300}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-20}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost/api/auth/sso/callback}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Google}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid email profile}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_ESS_ENABLED: ${AI_ESS_ENABLED:-true}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-true}
      AI_RATE_LIMIT_PER_USER_PER_MIN: ${AI_RATE_LIMIT_PER_USER_PER_MIN:-20}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - uploads_data:/data/uploads
      - nova_secrets:/secrets:ro

  # ─── Temporal (Workflow Engine) ───
  temporal:
    image: temporalio/auto-setup:1.24
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nova_app}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      # Applied only when the default namespace is first registered
      DEFAULT_NAMESPACE_RETENTION: ${DEFAULT_NAMESPACE_RETENTION:-720h}

  temporal-ui:
    image: temporalio/ui:2.26.2
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-http://localhost:3000}

  # ─── Nova Worker (Temporal Workflows) ───
  nova-worker:
    image: ${NOVA_IMAGE:-epolus/nova-suite}:worker-${NOVA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nova-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-nova_runtime}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      DB_SCHEMA_VERSION: ${DB_SCHEMA_VERSION:-v00.01.00}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-nova-itsm}
      TEMPORAL_RETENTION_DAYS: ${TEMPORAL_RETENTION_DAYS:-30}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?CREDENTIALS_MASTER_KEY is required}
      CATALOG_AUTOMATION_SHARED_KEY: ${CATALOG_AUTOMATION_SHARED_KEY:?CATALOG_AUTOMATION_SHARED_KEY is required}
      MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@nova.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # ─── Nova Web (SPA + API passthrough) ───
  nova-web:
    image: ${NOVA_IMAGE:-epolus/nova-suite}:web-${NOVA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - nova-engine

  # ─── Caddy (edge reverse proxy; routing table baked into the image) ───
  caddy:
    image: ${NOVA_IMAGE:-epolus/nova-suite}:proxy-${NOVA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - nova-engine
      - nova-web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  uploads_data:
  nova_secrets:
  caddy_data:
  caddy_config:
